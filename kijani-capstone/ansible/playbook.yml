---
- name: Configure KijaniKiosk Environment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure ConfigMap exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ configmap_name }}"
            namespace: "{{ target_namespace }}"
          data:
            APP_PORT: "{{ app_port }}"
            DB_HOST: "{{ db_host }}"
            NODE_ENV: "{{ node_env }}"
            S3_BUCKET_NAME: "{{ s3_bucket }}"
            S3_ENDPOINT: "{{ s3_endpoint }}"
            RECEIPTS_API_URL: "{{ receipts_api_url }}"
            
    - name: Ensure Secret exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ secret_name }}"
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            DB_PASSWORD: "{{ db_password }}"