services:
  jenkins:
    build: .
    container_name: kijani-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      # Mount host machine Kubernetes credentials
      - ~/.kube:/var/jenkins_home/.kube:ro
      - ~/.minikube:${HOST_HOME}/.minikube:ro
      # Attach Jenkins to the Minikube network
    networks:
      - minikube-net

volumes:
  jenkins_home:

networks:
  minikube-net:
    external: true
    name: minikube
      